<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{nav.myprofile} + ' - Kickoff Sim'">My Profile - Kickoff Sim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="page">
<div th:replace="~{fragments/topbar :: messages}"></div>

<div class="profile-wrap">
    <div class="profile-header">
        <div class="profile-avatar" th:text="${#strings.substring(profileUsername, 0, 1).toUpperCase()}"></div>
        <div class="profile-info">
            <h1 th:text="${profileUsername}"></h1>
            <span class="profile-role-badge"
                  th:classappend="${userRole == 'ADMIN'} ? ' prbadge-admin' : ' prbadge-user'"
                  th:text="${userRole}"></span>
        </div>
    </div>

    <form th:action="@{/profile}" th:object="${profileDto}" method="post" class="card-form profile-form">
        <div>
            <label th:text="#{profile.username}">Username</label>
            <input type="text" th:value="${profileUsername}" disabled class="input-disabled">
            <span class="field-hint" th:text="#{profile.username.hint}">Username cannot be changed.</span>
        </div>
        <div>
            <label for="email" th:text="#{profile.email}">Email</label> <span class="field-optional" th:text="#{profile.optional}">(optional)</span>
            <input type="email" id="email" th:field="*{email}" autocomplete="email" placeholder="your@email.com">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <button type="submit" class="btn-save-profile" th:text="#{profile.savechanges}">Save changes</button>
    </form>

    <form th:action="@{/profile/password}" th:object="${changePasswordDto}" method="post" class="card-form profile-form">
        <h2 class="profile-section-title" th:text="#{profile.changepassword}">Change password</h2>
        <div>
            <label for="currentPassword" th:text="#{profile.changepassword.current}">Current password</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}" autocomplete="current-password">
            <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
        </div>
        <div>
            <label for="newPassword" th:text="#{profile.changepassword.new}">New password</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password">
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </div>
        <div>
            <label for="confirmNewPassword" th:text="#{profile.changepassword.confirm}">Confirm new password</label>
            <input type="password" id="confirmNewPassword" th:field="*{confirmPassword}" autocomplete="new-password">
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>
        <button type="submit" class="btn-save-profile" th:text="#{profile.changepassword.button}">Change password</button>
    </form>

    <form id="deactivateSelfForm" th:action="@{/profile/deactivate}" th:object="${deactivateAccountDto}"
          method="post" class="card-form danger-zone">
        <h2 class="danger-zone-title" th:text="#{profile.dangerzone}">Danger zone</h2>
        <p class="field-hint" th:text="#{profile.deactivate.hint}">Deactivating your account will log you out and block further logins until an administrator reactivates it.</p>
        <div>
            <label for="deactivatePassword" th:text="#{profile.deactivate.password}">Confirm your password</label>
            <input type="password" id="deactivatePassword" th:field="*{password}" autocomplete="current-password">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <button type="button" class="btn-del"
                th:attr="onclick=|openConfirmDialog('deactivateSelfForm', '${#strings.escapeJavaScript(#messages.msg('profile.deactivate.title'))}', '${#strings.escapeJavaScript(profileUsername)}', '${#strings.escapeJavaScript(#messages.msg('profile.deactivate.body1'))}', '${#strings.escapeJavaScript(#messages.msg('profile.deactivate.body2'))}')|"
                th:text="#{profile.deactivate.button}">Deactivate my account</button>
    </form>
</div>

</main>
</body>
</html>
