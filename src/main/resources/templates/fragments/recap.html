<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel">
    <th:block th:if="${recap != null}">
        <div th:replace="~{fragments/recap :: sections(${recap})}"></div>
    </th:block>
</div>
<div th:fragment="sections(recap)" class="recap-feed">

    <article class="recap-headline" th:if="${recap.lead != null}"
             th:classappend="${'recap-k-' + recap.lead.kind.slug}">
        <span class="recap-tag" th:with="kindKey=${'recap.kind.' + recap.lead.kind.name()}">
            <span class="recap-tag-icon" th:text="${recap.lead.kind.icon}"></span>
            <span th:text="#{${kindKey}}"></span>
        </span>
        <h4 class="recap-headline-title" th:text="${recap.lead.headline}"></h4>
        <p class="recap-headline-body" th:text="${recap.lead.body}"></p>
    </article>

    <div class="recap-stat-strip" th:if="${recap.stats != null}">
        <div class="recap-stat" th:each="tile : ${recap.stats.tiles()}">
            <span class="recap-stat-value" th:text="${tile.value}"></span>
            <span class="recap-stat-label" th:text="${tile.label}"></span>
        </div>
    </div>

    <div class="recap-stories" th:if="${!recap.secondary.isEmpty()}">
        <article class="recap-story" th:each="story, iter : ${recap.secondary}"
                 th:classappend="${'recap-k-' + story.kind.slug + (iter.index == 0 ? ' recap-story-wide' : '')}">
            <span class="recap-tag" th:with="kindKey=${'recap.kind.' + story.kind.name()}">
                <span class="recap-tag-icon" th:text="${story.kind.icon}"></span>
                <span th:text="#{${kindKey}}"></span>
            </span>
            <h5 class="recap-story-title" th:text="${story.headline}"></h5>
            <p class="recap-story-body" th:text="${story.body}"></p>
        </article>
    </div>

    <section class="recap-lineup" th:if="${recap.squad != null}">
        <h5 class="recap-panel-title">
            <span class="recap-panel-icon" th:text="${recap.squad.kind.icon}"></span>
            <span th:text="${recap.squad.headline}"></span>
        </h5>
        <div class="recap-pitch">
            <div class="recap-pitch-line" th:each="line, lineIter : ${recap.squad.lineup()}">
                <div class="recap-slot" th:each="player, iter : ${line}"
                     th:classappend="${lineIter.index == 0 and iter.index == 0} ? 'recap-slot-star' : ''">
                    <span class="recap-shirt">
                        <span class="recap-shirt-initials" th:text="${player.initials}"></span>
                        <span class="recap-shirt-star" th:if="${lineIter.index == 0 and iter.index == 0}"
                              th:title="#{recap.lineup.star}">★</span>
                    </span>
                    <span class="recap-slot-name" th:text="${player.name}"></span>
                    <span class="recap-slot-team" th:text="${player.team}"></span>
                    <span class="recap-slot-stats" th:if="${player.goals > 0 or player.assists > 0}">
                        <span class="recap-slot-stat recap-slot-goals" th:if="${player.goals > 0}"
                              th:title="#{recap.player.goals}">
                            <span class="recap-slot-stat-icon">⚽</span><span th:text="${player.goals}"></span>
                        </span>
                        <span class="recap-slot-stat recap-slot-assists" th:if="${player.assists > 0}"
                              th:title="#{recap.player.assists}">
                            <span class="recap-slot-stat-icon">👟</span><span th:text="${player.assists}"></span>
                        </span>
                    </span>
                </div>
            </div>
        </div>
        <div class="recap-bench" th:if="${recap.bench != null}">
            <span class="recap-bench-title">
                <span class="recap-panel-icon" th:text="${recap.bench.kind.icon}"></span>
                <span th:text="${recap.bench.headline}"></span>
            </span>
            <span class="recap-bench-list">
                <span class="recap-bench-player" th:each="player : ${recap.bench.players()}">
                    <span class="recap-bench-name" th:text="${player.name}"></span>
                    <span class="recap-bench-team" th:text="${player.team}"></span>
                    <span class="recap-bench-stats" th:if="${player.goals > 0 or player.assists > 0}">
                        <span th:if="${player.goals > 0}" th:title="#{recap.player.goals}">⚽<span
                                th:text="${player.goals}"></span></span>
                        <span th:if="${player.assists > 0}" th:title="#{recap.player.assists}">👟<span
                                th:text="${player.assists}"></span></span>
                    </span>
                </span>
            </span>
        </div>
    </section>

    <div class="recap-panels" th:if="${!recap.lists.isEmpty()}">
        <section class="recap-panel" th:each="list : ${recap.lists}"
                 th:classappend="${list.kind.name() == 'RESULTS' ? 'recap-panel-results' : ''}">
            <h5 class="recap-panel-title">
                <span class="recap-panel-icon" th:text="${list.kind.icon}"></span>
                <span th:text="${list.headline}"></span>
            </h5>
            <ul class="recap-panel-items">
                <li th:each="item : ${list.results()}">
                    <a th:if="${item.id != null}" class="recap-result-link"
                       th:href="@{/matches/{id}(id=${item.id})}" th:text="${item.text}"></a>
                    <span th:if="${item.id == null}" th:text="${item.text}"></span>
                </li>
            </ul>
        </section>
    </div>

    <p class="recap-stamp" th:if="${recap.generatedAt != null}"
       th:text="#{recap.generatedat(${#temporals.format(recap.generatedAt, 'dd.MM.yyyy HH:mm')})}"></p>
</div>
</body>
</html>
