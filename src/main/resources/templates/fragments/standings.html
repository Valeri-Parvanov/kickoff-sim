<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="standingsTable(rows, highlightTeamId)">
<div class="table-wrapper">
    <table class="js-standings-sortable">
        <thead>
        <tr>
            <th class="js-sort" data-sort-type="number" th:title="#{standings.position.title}">#</th>
            <th class="js-sort" data-sort-type="text" th:text="#{standings.team}">Team</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.p}">P</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.w}">W</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.d}">D</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.l}">L</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.gf}">GF</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.ga}">GA</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.gd}">GD</th>
            <th class="js-sort" data-sort-type="number" th:text="#{standings.pts}">Pts</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row, stat : ${rows}"
            th:classappend="${(row.champion ? 'standings-champion ' : '')
                             + ((highlightTeamId != null and row.teamId != null and row.teamId == highlightTeamId) ? 'standings-highlight' : '')}"
            th:attr="data-team-id=${row.teamId}">
            <td th:text="${stat.index + 1}"></td>
            <td>
                <img th:src="@{/teams/{id}/logo(id=${row.teamId})}" class="team-logo-sm" alt=""/>
                <a th:href="@{/teams/{id}(id=${row.teamId})}"
                   th:text="${row.teamName + (row.teamCity != null ? ' (' + row.teamCity + ')' : '')}"></a>
                <span class="champion-badge" th:if="${row.champion}"
                      th:title="#{standings.champion.title}"
                      th:text="'&#127942; ' + #{standings.champion}"
                      title="Mathematically secured — cannot be caught">&#127942; Champion</span>
                <a class="standings-live-badge"
                   th:if="${liveTeamIds != null and liveTeamIds.contains(row.teamId)}">
                    <span class="slb-label">LIVE</span>
                    <span class="slb-score"></span>
                </a>
                <a class="standings-live-badge" style="display:none"
                   th:if="${liveTeamIds == null}">
                    <span class="slb-label">LIVE</span>
                    <span class="slb-score"></span>
                </a>
            </td>
            <td class="cell-p" th:text="${row.played}"></td>
            <td class="cell-w" th:text="${row.wins}"></td>
            <td class="cell-d" th:text="${row.draws}"></td>
            <td class="cell-l" th:text="${row.losses}"></td>
            <td class="cell-gf" th:text="${row.goalsFor}"></td>
            <td class="cell-ga" th:text="${row.goalsAgainst}"></td>
            <td class="cell-gd" th:classappend="${row.goalDiff > 0} ? 'cell-gd-pos' : (${row.goalDiff < 0} ? 'cell-gd-neg' : '')"
                th:text="${row.goalDiff}"></td>
            <td><strong class="cell-pts" th:text="${row.points}"></strong></td>
        </tr>
        </tbody>
    </table>
</div>
<script>
(function () {
    Array.prototype.forEach.call(document.querySelectorAll('.js-standings-sortable'), function (table) {
        if (table.dataset.sortableReady) return;
        table.dataset.sortableReady = '1';

        var tbody = table.tBodies[0];
        var original = Array.prototype.slice.call(tbody.rows);
        var headers = Array.prototype.slice.call(table.querySelectorAll('th.js-sort'));

        function cellValue(row, index, type) {
            var text = (row.cells[index].textContent || '').trim();
            if (type === 'number') {
                var n = parseFloat(text);
                return isNaN(n) ? 0 : n;
            }
            return text.toLowerCase();
        }

        headers.forEach(function (header) {
            header.classList.add('sortable-th');
            header.addEventListener('click', function () {
                var index = Array.prototype.indexOf.call(header.parentNode.cells, header);
                var type = header.dataset.sortType;
                var dir = header.dataset.dir === 'asc' ? 'desc' : 'asc';

                headers.forEach(function (h) {
                    delete h.dataset.dir;
                    h.classList.remove('sorted-asc', 'sorted-desc');
                });

                if (header.dataset.reset === '1') {
                    delete header.dataset.reset;
                    original.forEach(function (row) { tbody.appendChild(row); });
                    return;
                }

                var rows = Array.prototype.slice.call(tbody.rows);
                rows.sort(function (a, b) {
                    var va = cellValue(a, index, type);
                    var vb = cellValue(b, index, type);
                    if (va < vb) return dir === 'asc' ? -1 : 1;
                    if (va > vb) return dir === 'asc' ? 1 : -1;
                    return 0;
                });
                rows.forEach(function (row) { tbody.appendChild(row); });

                header.dataset.dir = dir;
                header.classList.add(dir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                if (dir === 'desc') header.dataset.reset = '1';
            });
        });
    });
})();
</script>
</th:block>

<th:block th:fragment="playerStatTable(rows, countLabel)">
<div class="stat-list" th:if="${!#lists.isEmpty(rows)}">
    <div class="stat-row" th:each="row, stat : ${rows}"
         th:classappend="${stat.index == 0} ? 'stat-row-gold' : (${stat.index == 1} ? 'stat-row-silver' : (${stat.index == 2} ? 'stat-row-bronze' : ''))">
        <span class="stat-rank" th:text="${stat.index + 1}"></span>
        <img th:if="${row.teamId != null}" th:src="@{/teams/{id}/logo(id=${row.teamId})}" class="stat-team-logo" alt=""/>
        <div class="stat-player">
            <div class="stat-player-name" th:text="${row.playerName}"></div>
            <a class="stat-team-link" th:if="${row.teamId != null}" th:href="@{/teams/{id}(id=${row.teamId})}"
               th:text="${row.teamName + (row.teamCity != null ? ' (' + row.teamCity + ')' : '')}"></a>
            <span class="stat-team-link stat-team-plain" th:unless="${row.teamId != null}"
                  th:text="${row.teamName + (row.teamCity != null ? ' (' + row.teamCity + ')' : '')}"></span>
        </div>
        <span class="stat-count">
            <strong th:text="${row.count}"></strong>
            <span class="stat-count-label" th:text="${countLabel}"></span>
        </span>
    </div>
</div>
<p th:if="${#lists.isEmpty(rows)}" class="no-matches" th:text="#{standings.nogoals}">No goals yet.</p>
</th:block>

<th:block th:fragment="leagueProgress(total, played)">
<div class="ldp-wrap" th:if="${total != null and total > 0}">
    <div class="ldp-header">
        <span class="ldp-label" th:text="#{standings.progress}">League progress</span>
        <span class="ldp-counts">
            <strong th:text="${played}"></strong> / <span th:text="${total}"></span> <span th:text="#{standings.matchesplayed}">matches played</span>
            &nbsp;&middot;&nbsp;
            <strong class="ldp-pct" th:text="${played * 100 / total} + '%'"></strong>
        </span>
    </div>
    <div class="ldp-track">
        <div class="ldp-fill" th:style="'width:' + ${played * 100 / total} + '%'"></div>
    </div>
</div>
</th:block>

</body>
</html>
