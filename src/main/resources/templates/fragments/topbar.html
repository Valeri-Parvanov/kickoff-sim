        <a th:href="@{/matches}">&#9917; <span th:text="#{nav.matches}">Matches</span></a>

        <div class="sidebar-section-label" sec:authorize="isAuthenticated()" th:text="#{nav.myaccount}">My Account</div>
        <a th:href="@{/feed}" sec:authorize="isAuthenticated()">&#127897; <span th:text="#{nav.myfeed}">My Feed</span></a>

    </svg>
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.6" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.9 1.9M17.3 17.3l1.9 1.9M19.2 4.8l-1.9 1.9M6.7 17.3l-1.9 1.9"/>
        </g>
    </svg>
</button>
<script>
(function() {
    var STORAGE_KEY = 'kickoffTheme';
    var root = document.documentElement;

    function apply(theme) {
        if (theme === 'dark') {
            root.setAttribute('data-theme', 'dark');
        } else {
            root.removeAttribute('data-theme');
        }
    }

    var stored;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        stored = 'dark';
    }
    apply(stored);

    document.addEventListener('DOMContentLoaded', function() {
        var fe = document.querySelector('.form-error-dialog');
        if (!fe) return;
        if (typeof fe.showModal === 'function') {
            fe.showModal();
        } else {
            fe.setAttribute('open', '');
        }
        fe.querySelector('.flash-dialog-ok').addEventListener('click', function() { fe.close(); });
        fe.addEventListener('click', function(e) { if (e.target === fe) fe.close(); });
    });

    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    btn.addEventListener('click', function() {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next);
        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
    });
}());
</script>

<div id="goal-toasts" class="goal-toast-wrap" sec:authorize="isAuthenticated()"
     th:attr="data-kickoff=#{toast.kickoff},data-halftime=#{toast.halftime},data-secondhalf=#{toast.secondhalf},data-fulltime=#{toast.fulltime},data-assist=#{toast.assist},data-vs=#{toast.vs},data-og=#{matches.og},data-pen=#{matches.pen}"></div>
<div id="global-js-i18n" hidden
     th:attr="data-locale=${#locale.toLanguageTag()},data-follow=#{matches.follow},data-unfollow=#{matches.unfollow},data-newer=#{matches.newer},data-older=#{matches.older},data-page=#{matches.page},data-results=#{matches.tab.results},data-round=#{matches.round},data-in-progress=#{matches.inprogress},data-selected-count=#{leagues.wizard.selectedcount},data-new-count=#{leagues.wizard.newcount},data-player-count=#{teams.squad.playercount}"></div>

<dialog id="confirmDialog" class="confirm-dialog" sec:authorize="isAuthenticated()">
    <div class="confirm-dialog-icon">&#9888;</div>
    <h2 class="confirm-dialog-title" id="confirmDialogTitle"></h2>
    <p class="confirm-dialog-body" id="confirmDialogBody"></p>
    <div class="confirm-dialog-actions">
        <button type="button" class="btn-cancel" onclick="document.getElementById('confirmDialog').close()" th:text="#{common.cancel}">Cancel</button>
        <button type="button" class="btn-del" id="confirmDialogConfirm" th:text="#{common.delete}">Delete</button>
    </div>
</dialog>
<script sec:authorize="isAuthenticated()">
(function() {
    var dialog = document.getElementById('confirmDialog');
    if (!dialog) return;
    var titleEl = document.getElementById('confirmDialogTitle');
    var bodyEl = document.getElementById('confirmDialogBody');
    var confirmBtn = document.getElementById('confirmDialogConfirm');
    var defaultConfirmLabel = confirmBtn.textContent;
    var pendingFormId = null;

    window.openConfirmDialog = function(formId, title, body, confirmLabel) {
        pendingFormId = formId;
        titleEl.textContent = title;
        bodyEl.textContent = body;
        confirmBtn.textContent = confirmLabel || defaultConfirmLabel;
        dialog.showModal();
    };

    confirmBtn.addEventListener('click', function() {
        if (pendingFormId) {
            document.getElementById(pendingFormId).submit();
        }
    });

    dialog.addEventListener('click', function(e) {
        if (e.target === dialog) dialog.close();
    });
})();
</script>
<script>
(function() {
    var tz;
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return; }
    if (!tz) return;
    var m = document.cookie.match(/(?:^|;\s*)tz=([^;]+)/);
    if (m && decodeURIComponent(m[1]) === tz) return;
    document.cookie = 'tz=' + encodeURIComponent(tz) + ';path=/;max-age=31536000;SameSite=Lax';
    location.reload();
}());
</script>
<script>
(function() {

    btn.addEventListener('click', function() {
        sidebar.classList.toggle('open');
    });
    sidebar.querySelectorAll('.sidebar-nav a').forEach(function(link) {
        link.addEventListener('click', function() { sidebar.classList.remove('open'); });
    });
}());
</script>
<script sec:authorize="isAuthenticated()">
(function() {
    var SHOWN_KEY = 'kickoffShownToasts';
    var MAX_VISIBLE_TOASTS = 4;

    function shownIds() {
        try { return JSON.parse(localStorage.getItem(SHOWN_KEY) || '[]'); } catch (e) { return []; }
    }

    function remember(id) {
        var ids = shownIds();
        ids.push(id);
        if (ids.length > 50) ids = ids.slice(-50);
        try { localStorage.setItem(SHOWN_KEY, JSON.stringify(ids)); } catch (e) {}
    }

    var GOAL_TOAST_RE = /^GOAL for (.+?)!\s*(.+?)(?:\s\(assist:\s(.+?)\))?(?:\s+(\d+)')?(?:\s\((own goal|penalty)\))?\s+—\s+(.+?)\s+(\d+):(\d+)\s+(.+)$/;
    var STATUS_TOAST_RE = /^(.+?)\s+vs\s+(.+?)\s+—\s+(FULL TIME|HALF TIME|SECOND HALF)\s+(\d+)-(\d+)$/;
    var KICKOFF_TOAST_RE = /^(.+?)\s+vs\s+(.+?)\s+—\s+KICK OFF!$/;

    var L = (function() {
        var w = document.getElementById('goal-toasts');
        var d = (w && w.dataset) || {};
        return {
            kickoff: d.kickoff || 'KICK OFF!',
            halftime: d.halftime || 'HALF TIME',
            secondhalf: d.secondhalf || 'SECOND HALF',
            fulltime: d.fulltime || 'FULL TIME',
            assist: d.assist || 'assist',
            og: d.og || 'OG',
            pen: d.pen || 'pen.',
            vs: d.vs || 'vs'
        };
    }());

    function statusLabel(englishLabel) {
        if (englishLabel === 'FULL TIME') return L.fulltime;
        if (englishLabel === 'SECOND HALF') return L.secondhalf;
        return L.halftime;
    }

    function showToast(message, type) {
        var wrap = document.getElementById('goal-toasts');
        if (!wrap) return;
        var el = document.createElement('div');
        el.className = 'goal-toast' + (type ? ' t-' + type.toLowerCase() : '');

        var body = document.createElement('div');
        body.className = 'goal-toast-body';

        var goalMatch = type === 'GOAL' ? message.match(GOAL_TOAST_RE) : null;
        if (goalMatch) {
            var team = goalMatch[1];
            var scorer = goalMatch[2];
            var assist = goalMatch[3];
            var minute = goalMatch[4];
            var flag = goalMatch[5];
            var homeTeam = goalMatch[6];
            var homeScore = goalMatch[7];
            var awayScore = goalMatch[8];
            var awayTeam = goalMatch[9];

            var teamLine = document.createElement('div');
            teamLine.className = 'goal-toast-team';
            teamLine.textContent = '⚽ ' + team;
            body.appendChild(teamLine);

            var matchLine = document.createElement('div');
            matchLine.className = 'goal-toast-match';
            matchLine.textContent = homeTeam + ' ' + L.vs + ' ' + awayTeam;
            body.appendChild(matchLine);

            var scoreLine = document.createElement('div');
            scoreLine.className = 'goal-toast-score';
            var homeIsScoring = team === homeTeam;
            var homeNum = document.createElement('span');
            homeNum.className = 'gts-num' + (homeIsScoring ? ' gts-hot' : '');
            homeNum.textContent = homeScore;
            var sep = document.createElement('span');
            sep.className = 'gts-sep';
            sep.textContent = ':';
            var awayNum = document.createElement('span');
            awayNum.className = 'gts-num' + (!homeIsScoring ? ' gts-hot' : '');
            awayNum.textContent = awayScore;
            scoreLine.appendChild(homeNum);
            scoreLine.appendChild(sep);
            scoreLine.appendChild(awayNum);
            body.appendChild(scoreLine);

            var scorerLine = document.createElement('div');
            scorerLine.className = 'goal-toast-scorer';
            scorerLine.appendChild(document.createTextNode(minute ? scorer + ' · ' + minute + '\'' : scorer));
            if (flag) {
                var badge = document.createElement('span');
                badge.className = 'goal-type-badge ' + (flag === 'own goal' ? 'og' : 'pen');
                badge.textContent = flag === 'own goal' ? L.og : L.pen;
                scorerLine.appendChild(document.createTextNode(' '));
                scorerLine.appendChild(badge);
            }
            body.appendChild(scorerLine);

            if (assist) {
                var assistLine = document.createElement('div');
                assistLine.className = 'goal-toast-assist';
                assistLine.textContent = L.assist + ': ' + assist;
                body.appendChild(assistLine);
            }
        } else if (type === 'MATCH_KICKOFF') {
            var kickoffMatch = message.match(KICKOFF_TOAST_RE);
            if (kickoffMatch) {
                var koHome = kickoffMatch[1];
                var koAway = kickoffMatch[2];

                var koStatusLine = document.createElement('div');
                koStatusLine.className = 'goal-toast-status';
                koStatusLine.textContent = '🟢 ' + L.kickoff;
                body.appendChild(koStatusLine);

                var koMatchLine = document.createElement('div');
                koMatchLine.className = 'goal-toast-scorer';
                koMatchLine.textContent = koHome + ' ' + L.vs + ' ' + koAway;
                body.appendChild(koMatchLine);
            } else {
                var koText = document.createElement('div');
                koText.className = 'goal-toast-msg';
                koText.textContent = message;
                body.appendChild(koText);
            }
        } else if (type === 'MATCH_HALFTIME' || type === 'MATCH_SECONDHALF' || type === 'MATCH_FULLTIME') {
            var statusMatch = message.match(STATUS_TOAST_RE);
            if (statusMatch) {
                var home = statusMatch[1];
                var away = statusMatch[2];
                var label = statusMatch[3];
                var hScore = statusMatch[4];
                var aScore = statusMatch[5];

                var statusIcon = label === 'FULL TIME' ? '🏁 ' : (label === 'SECOND HALF' ? '▶️ ' : '⏸ ');
                var statusLine = document.createElement('div');
                statusLine.className = 'goal-toast-status';
                statusLine.textContent = statusIcon + statusLabel(label);
                body.appendChild(statusLine);

                var statusMatchLine = document.createElement('div');
                statusMatchLine.className = 'goal-toast-scorer';
                statusMatchLine.textContent = home + ' ' + L.vs + ' ' + away + ' · ' + hScore + ':' + aScore;
                body.appendChild(statusMatchLine);
            } else {
                var statusText = document.createElement('div');
                statusText.className = 'goal-toast-msg';
                statusText.textContent = message;
                body.appendChild(statusText);
            }
        } else {
            var text = document.createElement('div');
            text.className = 'goal-toast-msg';
            text.textContent = message;
            body.appendChild(text);
        }

        var close = document.createElement('button');
        close.className = 'goal-toast-close';
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        el.appendChild(body);
        el.appendChild(close);
        wrap.appendChild(el);
        while (wrap.children.length > MAX_VISIBLE_TOASTS) {
            wrap.removeChild(wrap.firstElementChild);
        }
        requestAnimationFrame(function() { el.classList.add('show'); });

        var timer = setTimeout(dismiss, 15000 + Math.random() * 15000);
        function dismiss() {
            clearTimeout(timer);
            el.classList.remove('show');
            setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
        }
        close.addEventListener('click', dismiss);
    }

    function toastKey(type, message) {
        return type + '|' + message;
    }

    function showIfNew(type, message) {
        if (!message) return;
        var key = toastKey(type, message);
        if (shownIds().indexOf(key) !== -1) return;
        remember(key);
        showToast(message, type);
    }

    function pollToasts() {
        fetch('/notifications/toasts')
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(list) {
                if (!list || !list.length) return;
                list.forEach(function(n) { showIfNew(n.type, n.message); });
            })
            .catch(function() {});
    }

    function connectLiveStream() {
        if (!window.EventSource) return;
        var live = window.KickoffLive = window.KickoffLive || {connected: false, handlers: []};
        var es = new EventSource('/notifications/stream');
        es.addEventListener('open', function() { live.connected = true; });
        es.addEventListener('error', function() { live.connected = false; });
        es.addEventListener('matchUpdate', function() { if (live.emit) live.emit(); });
        es.addEventListener('toast', function(e) {
            try {
                var data = JSON.parse(e.data);
                showIfNew(data.type, data.message);
            } catch (err) {}
        });
    }

    pollToasts();
    connectLiveStream();
    setInterval(pollToasts, 20000);
}());
</script>
<script src="/js/live-updates.js"></script>
<script sec:authorize="isAuthenticated()">
(function() {
    document.addEventListener('click', function(e) {
        var btn = e.target.closest ? e.target.closest('.match-star') : null;
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();

        var form = btn.closest('form');
        if (!form || btn.disabled) return;

        btn.disabled = true;
        fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function(data) {
                btn.classList.toggle('followed', data.following);
                btn.setAttribute('aria-pressed', data.following);
                btn.title = data.following
                    ? document.getElementById('global-js-i18n').dataset.unfollow
                    : document.getElementById('global-js-i18n').dataset.follow;
            })
            .catch(function() {})
            .then(function() { btn.disabled = false; });
    }, true);
}());
</script>
<script>
(function() {
    var input = document.getElementById('globalSearchInput');
    var dropdown = document.getElementById('globalSearchResults');
    if (!input || !dropdown) return;

    var MIN_LENGTH = 3;
    var DEBOUNCE_MS = 300;
    var labels = {
        teams: dropdown.dataset.labelTeams,
        players: dropdown.dataset.labelPlayers,
        leagues: dropdown.dataset.labelLeagues
    };
    var icons = { teams: '🛡️', players: '🧑', leagues: '🏆' };
    var noResultsText = dropdown.dataset.noResults;
    var debounceTimer = null;
    var currentRequestId = 0;

    function hideDropdown() {
        dropdown.hidden = true;
        dropdown.textContent = '';
    }

    function renderGroup(key, items) {
        if (!items || !items.length) return null;
        var group = document.createElement('div');
        group.className = 'global-search-group';

        var label = document.createElement('div');
        label.className = 'global-search-group-label';
        label.textContent = icons[key] + ' ' + labels[key];
        group.appendChild(label);

        items.forEach(function(item) {
            var link = document.createElement('a');
            link.className = 'global-search-item';
            link.href = item.url;

            var main = document.createElement('span');
            main.className = 'global-search-item-label';
            main.textContent = item.label;
            link.appendChild(main);

            if (item.sublabel) {
                var sub = document.createElement('span');
                sub.className = 'global-search-item-sublabel';
                sub.textContent = item.sublabel;
                link.appendChild(sub);
            }

            group.appendChild(link);
        });

        return group;
    }

    function renderResults(data) {
        dropdown.textContent = '';
        var groups = [
            renderGroup('teams', data.teams),
            renderGroup('players', data.players),
            renderGroup('leagues', data.leagues)
        ].filter(function(g) { return g !== null; });

        if (!groups.length) {
            var empty = document.createElement('div');
            empty.className = 'global-search-empty';
            empty.textContent = noResultsText;
            dropdown.appendChild(empty);
        } else {
            groups.forEach(function(g) { dropdown.appendChild(g); });
        }
        dropdown.hidden = false;
    }

    function runSearch(q) {
        var requestId = ++currentRequestId;
        fetch('/search/suggest?q=' + encodeURIComponent(q))
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function(data) {
                if (requestId !== currentRequestId) return;
                renderResults(data);
            })
            .catch(function() {});
    }

    input.addEventListener('input', function() {
        var q = input.value.trim();
        clearTimeout(debounceTimer);
        if (q.length < MIN_LENGTH) {
            hideDropdown();
            return;
        }
        debounceTimer = setTimeout(function() { runSearch(q); }, DEBOUNCE_MS);
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            hideDropdown();
            input.blur();
        }
    });

    document.addEventListener('click', function(e) {
        if (e.target === input || dropdown.contains(e.target)) return;
        hideDropdown();
    });
}());
</script>
</th:block>

</dialog>
</th:block>

<th:block th:fragment="messages">
<th:block th:with="hasFlash=${statusMessage != null or warnMessage != null or errorMessage != null or scheduleError != null},
                   isError=${errorMessage != null or scheduleError != null},
                   isWarn=${warnMessage != null}">
<dialog th:if="${hasFlash}" id="flashDialog" class="flash-dialog"
        th:classappend="${isError} ? ' fd-error' : (${isWarn} ? ' fd-warn' : ' fd-success')"
        aria-labelledby="flashDialogTitle">
    <div class="flash-dialog-icon" aria-hidden="true">
        <span th:if="${isError}">&#10006;</span>
        <span th:if="${!isError and isWarn}">&#33;</span>
        <span th:if="${!isError and !isWarn}">&#10004;</span>
    </div>
    <h2 class="flash-dialog-title" id="flashDialogTitle"
        th:text="${flashTitle != null}
                    ? (${#messages.msgOrNull(flashTitle) != null ? #messages.msgOrNull(flashTitle) : flashTitle})
                    : (${isError} ? #{flash.title.error} : (${isWarn} ? #{flash.title.warning} : #{flash.title.success}))">Done</h2>
    <div class="flash-dialog-body">
        <p th:if="${statusMessage}"
           th:text="${#messages.msgOrNull(statusMessage) != null ? #messages.msgOrNull(statusMessage) : statusMessage}"></p>
        <p th:if="${warnMessage}"
           th:text="${#messages.msgOrNull(warnMessage) != null ? #messages.msgOrNull(warnMessage) : warnMessage}"></p>
        <p th:if="${errorMessage}"
           th:text="${#messages.msgOrNull(errorMessage) != null ? #messages.msgOrNull(errorMessage) : errorMessage}"></p>
        <p th:if="${scheduleError}"
           th:text="${#messages.msgOrNull(scheduleError) != null ? #messages.msgOrNull(scheduleError) : scheduleError}"></p>
    </div>
    <div class="flash-dialog-actions">
        <button type="button" class="flash-dialog-ok" th:text="#{common.ok}">OK</button>
    </div>
</dialog>
<script th:if="${hasFlash}">
(function() {
    var d = document.getElementById('flashDialog');
    if (!d) return;
    if (typeof d.showModal === 'function') {
        d.showModal();
    } else {
        d.setAttribute('open', '');
    }
    d.querySelector('.flash-dialog-ok').addEventListener('click', function() { d.close(); });
    d.addEventListener('click', function(e) { if (e.target === d) d.close(); });
}());
</script>
</th:block>
</th:block>

<th:block th:fragment="goalRow(m, g)">
    <div class="half-label" th:if="${g.firstInHalf}" th:attr="data-half=${g.half.name()}">
        <span th:text="${g.half.name() == 'FIRST'} ? #{matches.half1} : #{matches.half2}"></span>
        <span class="half-score" th:if="${g.half.name() == 'FIRST'}"
              th:text="${m.homeHalfScore} + ':' + ${m.awayHalfScore}"></span>
        <span class="half-score" th:unless="${g.half.name() == 'FIRST'}"
              th:text="${m.homeScore - m.homeHalfScore} + ':' + ${m.awayScore - m.awayHalfScore}"></span>
    </div>
    <div class="timeline-row"
         th:attr="data-half=${g.half.name()},data-minute=${g.minute != null ? g.minute : 0},data-offset=${g.offsetSeconds != null ? g.offsetSeconds : 0}">
        <div class="tl-home">
            <th:block th:if="${g.homeGoal}">
                <span class="goal-icon">&#9917;</span>
                <span class="goal-minute" th:if="${g.minute != null}"
                      th:text="${(g.half.name() == 'FIRST' ? g.minute : g.minute + 20)} + '\'' + ' '"></span>
                <span class="goal-scorer-name" th:text="${g.scorerName}"></span>
                <span class="goal-type-badge og" th:if="${g.ownGoal}" th:text="#{matches.og}">OG</span>
                <span class="goal-type-badge pen" th:if="${g.penalty}" th:text="#{matches.pen}">pen.</span>
                <span class="goal-assist" th:if="${g.assistantName != null}"
                      th:text="' (' + ${g.assistantName} + ')'"></span>
                <span class="running-score"
                      th:text="${g.runningHomeScore} + ':' + ${g.runningAwayScore}"></span>
            </th:block>
        </div>
        <div class="tl-away">
            <th:block th:unless="${g.homeGoal}">
                <span class="running-score"
                      th:text="${g.runningHomeScore} + ':' + ${g.runningAwayScore}"></span>
                <span class="goal-assist" th:if="${g.assistantName != null}"
                      th:text="'(' + ${g.assistantName} + ') '"></span>
                <span class="goal-scorer-name" th:text="${g.scorerName}"></span>
                <span class="goal-type-badge og" th:if="${g.ownGoal}" th:text="#{matches.og}">OG</span>
                <span class="goal-type-badge pen" th:if="${g.penalty}" th:text="#{matches.pen}">pen.</span>
                <span class="goal-minute" th:if="${g.minute != null}"
                      th:text="' ' + ${(g.half.name() == 'FIRST' ? g.minute : g.minute + 20)} + '\''"></span>
                <span class="goal-icon">&#9917;</span>
            </th:block>
        </div>
    </div>
</th:block>

<th:block th:fragment="weatherToggle(matchId)">
    <div class="match-weather-row">
        <button type="button" class="match-weather-btn"
                th:attr="data-match-id=${matchId},data-unavailable=#{matches.weather.unavailable},data-loading=#{matches.weather.loading}"
                th:text="#{matches.weather.details}">Weather</button>
        <span class="match-weather-chip" hidden></span>
    </div>
</th:block>

<th:block th:fragment="matchStar(matchId)"
          th:with="followed=${subscribedMatchIds != null and subscribedMatchIds.contains(matchId)}">
    <form sec:authorize="isAuthenticated()"
          th:action="@{/notifications/match/{id}/toggle(id=${matchId})}" method="post"
          class="match-star-form">
        <button type="submit" class="match-star"
                th:classappend="${followed} ? ' followed' : ''"
                th:title="${followed} ? #{matches.unfollow} : #{matches.follow}"
                th:attr="aria-pressed=${followed}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </button>
    </form>
</th:block>
