spring.application.name=kickoff-sim

spring.mvc.hiddenmethod.filter.enabled=true

spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:mysql://localhost:3306/kickoff_sim?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

notifications.service.url=http://localhost:8081

logging.level.com.kickoffsim.client.NotificationClient=WARN
logging.level.com.kickoffsim.aop.ServiceExecutionLoggingAspect=WARN
logging.level.root=INFO

kickoffsim.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
kickoffsim.ollama.model=${OLLAMA_MODEL:gemma3:4b}
