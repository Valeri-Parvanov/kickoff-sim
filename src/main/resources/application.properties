spring.application.name=kickoff-sim

spring.mvc.hiddenmethod.filter.enabled=true

spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:mysql://localhost:3306/kickoff_sim?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=32

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

notifications.service.url=http://localhost:8081
notifications.match-event-max-age-hours=3
matches.auto-simulate-max-age-hours=48
notifications.service.connect-timeout-millis=500
notifications.service.read-timeout-millis=1500

logging.level.com.kickoffsim.client.NotificationClient=WARN
logging.level.com.kickoffsim.aop.ServiceExecutionLoggingAspect=WARN
logging.level.root=INFO

# Templates are compiled once and reused. The dev profile turns this off so local
# edits still show up without a restart - see application-dev.properties.
spring.thymeleaf.cache=true
